<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EcoSmart Registration</title><link rel="stylesheet" href="style.css"></head>
<body><main class="auth-shell"><section class="form-card auth-card"><a class="nav-logo" href="/">🌿 EcoSmart</a><h1>Create account</h1><p class="auth-copy">Register as a community member to track your reports.</p><form id="authForm" class="report-form"><label>Full name<input id="full_name" type="text" required minlength="2" maxlength="120" autocomplete="name"></label><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required minlength="8" autocomplete="new-password"></label><p id="message" class="field-error"></p><button class="btn-primary" type="submit">Create account</button></form><p>Already registered? <a class="accent" href="/login">Sign in</a></p></section></main><script src="auth.js"></script></body></html>
