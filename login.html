<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EcoSmart Login</title><link rel="stylesheet" href="style.css"></head>
<body><main class="auth-shell"><section class="form-card auth-card"><a class="nav-logo" href="/">🌿 EcoSmart</a><h1>Sign in</h1><p class="auth-copy">Access your reports and collection requests.</p><form id="authForm" class="report-form"><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><p id="message" class="field-error"></p><button class="btn-primary" type="submit">Sign in</button></form><p>New to EcoSmart? <a class="accent" href="/register">Create an account</a></p></section></main><script src="auth.js"></script></body></html>
